name: Publish Hrio Design to Comfy Registry

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "__init__.py"
      - "*.py"
      - "*.json"
      - "web/**"
      - ".github/workflows/publish_action.yml"
  workflow_dispatch:

jobs:
  publish-node:
    name: Publish Custom Node to Comfy Registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
